[project]
name = "pxvault"
version = "0.1.0"
description = "Personal media vault system"
authors = [{name = "pxvault", email = "dev@pxvault.com"}]
dependencies = [
    "pillow>=10.4.0",
    "python-magic>=0.4.27",
    "pytest>=9.0.2",
    "file-magic>=0.4.1",
    "ruff>=0.15.9",
]

[project.optional-dependencies]
smb = [
    "smbprotocol>=1.10.0",
    "pysmb>=1.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scanner", "db"]
